version: '3'
services:
  postgres:
    image: 'postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336'
    ports:
      - 5432:5432

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo_dev

  otel:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4318:4318"
      - '55681:55681'
      - '55680:55680'
      - "55679:55679"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - jaeger
      - zipkin

  zipkin:
    image: openzipkin/zipkin-slim:3.6.1@sha256:fc29b9862c14f4fc241cf0259c585e1cfd4e9b18f01ad36d86adaabb7d01815c
    container_name: "zipkin"
    ports:
      - '9411:9411'

  # Jaeger
  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    container_name: "jaeger"
    ports:
      - "4317:4317"
      - "16686:16686"
      - "14268"
      - "14250:14250"
